name: NFL line feed

on:
  schedule:
    - cron: "47 4,10,16,22 * * *"
    - cron: "47 19 * * 0"
    - cron: "52 23 * * 0,1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-odds-feed
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-odds.txt

      - name: Pull odds and rebuild line movement
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nfl_odds.run

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl/odds
          if git diff --staged --quiet; then
            echo "No new odds"
            exit 0
          fi
          git commit -m "chore: NFL line feed $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
